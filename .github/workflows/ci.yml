name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getpaid
          POSTGRES_PASSWORD: getpaid
          POSTGRES_DB: getpaid
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U getpaid" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.12.15"
      - run: cd api && uv sync --locked
      - run: cd api && uv run ruff check . && uv run ruff format --check .
      - run: cd api && uv run mypy src tests
      - run: cd api && uv run pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit && npm run lint
      - run: cd web && npx vitest run
      - name: Generated API types are current
        run: cd web && npm run types && git diff --exit-code src/lib/api-types.ts
  e2e:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getpaid
          POSTGRES_PASSWORD: getpaid
          POSTGRES_DB: getpaid
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U getpaid" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.12.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd api && uv sync --locked
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Full-history secret scan (gitleaks 8.24.3, checksum-pinned)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
