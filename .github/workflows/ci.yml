name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getpaid
          POSTGRES_PASSWORD: getpaid
          POSTGRES_DB: getpaid
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U getpaid" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.12.15"
      - run: cd api && uv sync --locked
      - run: cd api && uv run ruff check . && uv run ruff format --check .
      - run: cd api && uv run mypy src tests
      - run: cd api && uv run pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit && npm run lint
      - run: cd web && npx vitest run
  e2e:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getpaid
          POSTGRES_PASSWORD: getpaid
          POSTGRES_DB: getpaid
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U getpaid" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.12.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd api && uv sync --locked
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
