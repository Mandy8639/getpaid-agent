services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getpaid
      POSTGRES_PASSWORD: getpaid
      POSTGRES_DB: getpaid
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getpaid"]
      interval: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
