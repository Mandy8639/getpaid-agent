[project]
name = "getpaid"
version = "0.1.0"
description = "Approval-gated agent that drafts follow-ups for overdue invoices"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "langgraph>=0.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "mcp>=1.9",
  "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "pytest-socket>=0.8.1",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getpaid"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]  # fake keys/paths; non-crypto random in tests
"tests/test_migrations.py" = ["E501"]  # raw SQL for the pre-Alembic schema

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to the real sandbox through the MCP server (RUN_LIVE=1)"]
addopts = "--cov=getpaid --cov-report=term-missing --cov-fail-under=80 --disable-socket --allow-hosts=127.0.0.1,::1"
